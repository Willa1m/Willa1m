name: 3D contribution calendar

on:
  schedule:
    - cron: "41 5 * * *"   # daily, 05:41 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/3d-contrib.yml"
      - ".github/3d-contrib-settings.json"

permissions:
  contents: write

concurrency:
  group: profile-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-contrib-settings.json

      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib
          if git commit -m "Generate 3D contribution calendar"; then
            git pull --rebase origin main
            git push
          fi
